<script src="answer-gate.js"></script>

<script>
// Copy button for pre blocks
document.querySelectorAll('pre').forEach(function(pre) {
  var btn = document.createElement('button');
  btn.className = 'copy-btn';
  btn.textContent = 'コピー';
  btn.addEventListener('click', function() {
    var clone = pre.cloneNode(true);
    clone.querySelectorAll(".copy-btn").forEach(function(b){b.remove();});
    clone.querySelectorAll(".code-label").forEach(function(l){l.remove();});
    var code = clone.textContent.trim().replace(/^(Python|JavaScript|HTML|Bash|JSON|Terminal|Directory Tree|Notion テンプレート)( ── [^\n]+)?\n/, '');
    navigator.clipboard.writeText(code).then(function() {
      btn.textContent = 'コピーしました';
      btn.classList.add('copied');
      setTimeout(function() {
        btn.textContent = 'コピー';
        btn.classList.remove('copied');
      }, 2000);
    });
  });
  pre.appendChild(btn);
});

// コードをすべて閉じる／開くボタン（コードの箱があるページだけ）
(function() {
  var folds = document.querySelectorAll('details.code-fold');
  if (folds.length === 0) return;
  var btn = document.createElement('button');
  btn.className = 'fold-all-btn';
  function update() {
    var anyOpen = Array.prototype.some.call(folds, function(d) { return d.open; });
    btn.textContent = anyOpen ? 'コードをすべて閉じる' : 'コードをすべて開く';
  }
  btn.addEventListener('click', function() {
    var anyOpen = Array.prototype.some.call(folds, function(d) { return d.open; });
    folds.forEach(function(d) { d.open = !anyOpen; });
    update();
  });
  folds.forEach(function(d) { d.addEventListener('toggle', update); });
  update();
  document.body.appendChild(btn);
})();
</script>

</body>
</html>
